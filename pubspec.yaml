name: worklist
description: "Worklist, a cross-platform site and worker management application for construction projects."
publish_to: 'none'
version: 1.3.1+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.2

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.4

  # Security
  crypto: ^3.0.3

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.1
  firebase_core: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
