name: worklist
description: "Worklist, a cross-platform site and worker management application for construction projects."
publish_to: 'none'
version: 1.4.1+8

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.4

  # Security
  crypto: ^3.0.3
  # Deep-link handling for Firebase email-link (passwordless) sign-in.
  app_links: ^6.3.2
  firebase_messaging: ^16.4.1

  # Utilities
  shared_preferences: ^2.2.3

  # UI
  http: ^1.6.0
  url_launcher: ^6.3.1
  material_ui: ^1.11.0
  firebase_core: 4.11.0
  firebase_app_check: 0.4.5
  google_sign_in: ^6.2.2
  firebase_auth: 6.5.4
  firebase_database: 12.4.4
  google_sign_in_dartio: ^0.3.0
  flutter_local_notifications: ^22.0.1
  workmanager: ^0.9.0+3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.3
  fl_chart: ^0.68.0
  image_picker: ^1.0.7
  open_file: ^3.3.2
  # Barcode
  barcode_widget: ^2.0.4
  simple_barcode_scanner: ^0.6.0
  pdf: ^3.12.0
  path_provider: ^2.1.6
  uuid: ^4.5.3
  image: ^4.8.0
  file_picker: ^11.0.2
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # integration_test:
  #   sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/google-services.json
