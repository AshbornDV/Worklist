name: worklist
description: "Worklist, a cross-platform site and worker management application for construction projects."
publish_to: 'none'
version: 1.4.0+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.4

  # Security
  crypto: ^3.0.3

  # Utilities
  shared_preferences: ^2.2.3

  # UI
  http: ^1.6.0
  url_launcher: ^6.3.1
  firebase_core: ^4.11.0
  firebase_app_check: ^0.4.5
  google_sign_in: ^6.2.2
  firebase_auth: ^6.5.4
  google_sign_in_dartio: ^0.3.0
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google-services.json
